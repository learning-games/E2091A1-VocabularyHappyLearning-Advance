<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>เกม-vocabulary happy learning ป.4-6</title>
<style>

/* ===== ฟอนต์รวมหน้า ===== */
@font-face{
  font-family: 'MyGameFont';
  src: url('image/THSarabunNew.woff2') format('woff2'),
       url('image/THSarabunNew.woff') format('woff'),
       url('image/THSarabunNew.ttf') format('truetype');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face{
  font-family: 'MyGameFont';
  src: url('image/THSarabunNewBold.woff2') format('woff2'),
       url('image/THSarabunNewBold.woff') format('woff'),
       url('image/THSarabunNewBold.ttf') format('truetype');
  font-weight: 700; font-style: normal; font-display: swap;
}
html, body, button, input, select, textarea, .pill, .btn, .btn-mini,
.levelBtn, #startTitle, #countdown, .label, #timer {
  font-family: 'MyGameFont', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}

:root{
  --glass: rgba(0,0,0,.45);
  --ok: #10b981;
  --bad: #ef4444;
  --hud-top: 15px;                 
  --safe-top: env(safe-area-inset-top, 0px);

  /* ปรับความเร็วเอฟเฟกต์ fade ได้ที่นี่ */
  --fade-ms: 600ms;   /* เช่น 400ms / 800ms */
}


*{ box-sizing:border-box }
html,body{ height:100%; margin:0 }
body{
  background: url("image/background2.png") center center / cover no-repeat fixed !important;
  overflow:hidden; color:#fff;
}
#game{ position:relative; width:100vw; height:100vh; overflow:hidden }

/* ===== HUD ===== */
.hud{
  position:fixed;
  inset: calc(var(--safe-top) + var(--hud-top)) 5px auto 38px !important;
  display:flex;
  align-items:center;
  gap:12px;
  justify-content:space-between;
  pointer-events:none;
  z-index:40000;
}

/* === ซ่อน/แสดง HUD และนาฬิกา === */
/* ซ่อน HUD ถ้าไม่ได้อยู่ในเกม และไม่ได้อยู่หน้า prestart */
body:not(.in-game):not(.prestart) .hud {
  display: none !important;
}
/* นาฬิกา โผล่เฉพาะตอน in-game เท่านั้น */
body:not(.in-game) #clock {
  display: none !important;
}



/* ===== Game Clock (Top Center, uses existing timer) ===== */
#clock.clock-pill{
  position:fixed;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:16000;
  pointer-events:none;

  /* ปรับขนาดได้ */
  --clock-size: 40px;
  font-size: var(--clock-size);

  background: var(--glass);
  backdrop-filter: blur(6px);
  color:#fff;
  font-weight:1000;
  line-height:1;
  border-radius:999px;
  padding:8px 16px;
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  text-shadow:0 3px 10px rgba(0,0,0,.55);
}
@media (max-width:480px){
  #clock.clock-pill{ --clock-size: 28px; padding:6px 12px; }
}

.pill{ background:var(--glass); backdrop-filter:blur(6px); padding:8px 12px; border-radius:999px; box-shadow:0 4px 18px rgba(0,0,0,.25) }
#timer{ font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.5px; font-size:20px }
.btn-mini{ pointer-events:auto; background:#1f2937; color:#fff; border:none; border-radius:12px; padding:8px 12px; font-weight:800; cursor:pointer; box-shadow:0 4px 18px rgba(0,0,0,.25) }
.btn-mini:hover{ filter:brightness(1.1) }

.score-label{ font-size:20px; font-weight:900; color:#fff; margin-bottom:6px; text-align:center; width:100%; margin-top:-4px; }

/* กล่องคะแนนเป็นตัวเลข ปรับขนาดด้วย --score-size */
.pill.gold{
  --score-size: 42px;             /* << เปลี่ยนเลขนี้เพื่อปรับขนาด */
  background: var(--glass);
  border-radius: 12px;
  padding: 6px 12px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: calc(var(--score-size) * 1.6);
  box-shadow: 0 4px 18px rgba(0,0,0,.25);
}
.pill.gold .num{
  font-size: var(--score-size);
  font-weight: 1000;
  font-variant-numeric: tabular-nums;
  letter-spacing: .5px;
}

@media (max-width:480px){ .pill.gold{ --gold-size:24px; --gold-cols:8; --gold-rows:2 } }

/* ===== Welcome / Landing ===== */
#landing{
  position:fixed;
  inset:0;
  background:url("image/background2.png") center/cover no-repeat fixed !important;
  z-index:20000;
  transition:opacity .3s ease;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;
}

#landing.hide{
  opacity:0;
  pointer-events:none;
  visibility:hidden;
}

#landing .landing-inner{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(8px, 2dvh, 22px);
  width:min(92vw,1100px);

  transform:scale(var(--landing-scale, 1));
  transform-origin:center;
}


#landing.hide{ opacity:0; pointer-events:none; visibility:hidden }
#landing .brand{ width:min(92vw,1100px) }
#landing .brand img{ width:100%; height:auto; display:block; filter:drop-shadow(0 10px 30px rgba(0,0,0,.6)) }
#welcome{ position:fixed; inset:0; background:url("image/welcome.png") center/cover no-repeat fixed; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; z-index:25000; transition:opacity .3s ease; }
#welcome.hide{ opacity:0; pointer-events:none; visibility:hidden }

#welcome #enterBtn{ padding:12px 28px; font-size:clamp(22px,4vw,36px); font-weight:1000; letter-spacing:.2px; border:0; border-radius:16px; color:#fff; background:rgba(0,0,0,.55); box-shadow:0 10px 28px rgba(0,0,0,.35); cursor:pointer; backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.18) }

#welcome .brand{ width:min(90vw,1000px); 
        margin-bottom:100px; 
        display:flex; 
        justify-content:center 
}

#welcome .brand img{
  width:min(150%, 1400px);   /* 👈 ขยายได้อีก */
  max-width:150%;

  height:auto;
  max-height:75dvh;          /* 👈 เพิ่มจาก 65 → 75 */

  object-fit:contain;

  display:block;
  animation:pulse 3s infinite ease-in-out;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.45));
}

#welcome .welcome-content{ 
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

#welcome #enterBtn{
  position:absolute;
  left:50%;
  transform:translateX(-50%);

  bottom: 12dvh;   /* 🔥 ปรับตำแหน่งจากล่างจอ */
}

@keyframes pulse{ 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.04);opacity:.9} }

.level-menu{ display:flex; flex-direction:column; gap:14px; width:min(92vw,640px) }
.levelBtn{
  width: 70%;              /* 🔥 ปรับความยาวตรงนี้ */
  max-width: 420px;        /* กันยาวเกิน */
  min-width: 260px;        /* กันสั้นเกิน */      
  margin: 0 auto;          
  padding: 10px 20px;

  font-size: clamp(20px,4vw,34px);
  font-weight:1000;
  letter-spacing:.2px;
  border:0;
  border-radius:14px;
  color:#fff;
  background:rgba(0,0,0,.55);
  box-shadow:0 10px 28px rgba(0,0,0,.35);
  cursor:pointer;
  text-align:center;
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(6px)
}

#startScreen{
  position:fixed;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.9);
  z-index:30000;       
  text-align:center;
  padding:24px;
}

#startTitle{ font-size:clamp(26px,5vw,48px); font-weight:900; margin-bottom:10px }
#startBtn{
  /* 🔻 ลดขนาดลง */
  padding: clamp(10px, 2dvh, 16px) clamp(26px, 6vw, 46px);
  font-size: clamp(22px, 4.5vw, 40px);
  background: linear-gradient(180deg, #ffe066, #ffcc00);
  color: #fff;
  text-shadow:
    0 2px 6px rgba(0,0,0,.6),
    0 0 10px rgba(0,0,0,.4);

  border: none;
  border-radius: 14px;
  box-shadow:
    0 8px 20px rgba(0,0,0,.35),
    0 0 12px rgba(255,220,0,.5);

  font-weight: bold;
}

#startBtn:hover{
  transform: scale(1.07); 
  filter: brightness(1.1);

  box-shadow:
    0 12px 28px rgba(0,0,0,.45),
    0 0 20px rgba(255,230,0,.7);
}

#startBtn:active{
  transform: scale(0.95);
}

#countdown{ display:none; font-size:clamp(56px,12vw,120px); font-weight:1000; line-height:1; margin-top:8px }

/* ===== ภาพประกอบคำถาม (จัดกลางทั้งแนวตั้ง-แนวนอน) ===== */
#qImg{
  position:absolute;
  top: 50%;
  left: 50%;
  max-width: min(60vw, 720px);
  max-height: min(48vh, 480px);
  width:auto; height:auto;
  display:none;
  z-index:9;
  filter: drop-shadow(0 10px 30px rgba(0,0,0,.45));
  border-radius: 12px;

  /* จัดกลางแท้ ๆ แล้วค่อยเติม FX */
  transform: translate(-50%, -50%)
             translate(var(--fxX, 0), var(--fxY, 0))
             scale(var(--fxS, 1));

  transition:
    transform 520ms cubic-bezier(.2,.9,.2,1),
    opacity 520ms;
}






/* ===== กล่องคำถาม (เวอร์ชันใช้ตัวแปร FX) ===== */
#questionBox{
  position: fixed;             /* เดิมเป็น absolute → fixed เพื่ออิง viewport ตลอด */
  top: var(--qTop);            /* ใช้ตัวแปรกำหนดระยะจากขอบบน */
  left: 50%;
  transform: translate(-50%, 0)
             translate(var(--fxX, 0), var(--fxY, 0))
             scale(var(--fxS, 1));
  background:none; border:none; padding:0;
  font-size: clamp(var(--qFontMin), var(--qFontVW), var(--qFontMax)); 
  font-weight:1000; color:#fff;
  text-shadow:0 4px 12px rgba(0,0,0,.8);
  z-index: 10;
  white-space:pre; overflow:visible; text-align:center;
  transition: transform 520ms cubic-bezier(.2,.9,.2,1), opacity 520ms;
}

#questionBox.pre-drop{
  top: calc(var(--qTop) - 40px);
  opacity: 0;
}

/* ===== ตัวเลือกแบบวงกลม 2 ปุ่ม ===== */
.option.circle{
  position:absolute;
  width: var(--c-sz, clamp(120px, 18vw, 220px));
  height: var(--c-sz, clamp(120px, 18vw, 220px));
  border-radius:50%;
  border:10px solid transparent;
  background:
    radial-gradient(35% 35% at 30% 30%, rgba(255,255,255,.18), rgba(255,255,255,0) 60%) padding-box,
    var(--ring, linear-gradient(130deg,#999,#666)) border-box;
  box-shadow:0 8px 28px rgba(0,0,0,.35);
  display:grid; place-items:center;
  cursor:pointer; user-select:none; z-index:12;
  transition: top 800ms cubic-bezier(.2,.9,.2,1),
             left 800ms cubic-bezier(.2,.9,.2,1);
}

.option.circle .label{ 
       font-weight:1000; 
       font-size:clamp(18px,2.2vw,32px); 
       color:#fff; 
       text-align:center; 
       text-shadow:0 3px 10px rgba(0,0,0,.6); 
       padding:0 10px; line-height:1.15 }

/* ===== ปุ่มตัวเลือกใหม่ ===== */
.option.circle.live {
  background: rgba(0,0,0,.55);                  
  border: 10px solid #d97706;                    
  box-shadow: 0 6px 18px rgba(0,0,0,.35);       
}

.option.circle.non {
  background: rgba(0,0,0,.55);                  
  border: 10px solid #a855f7;                  
  box-shadow: 0 6px 18px rgba(0,0,0,.35);      
}

/* ขนาดของวงกลม (ปรับได้ตรงนี้) */
.option.circle {
  --c-sz: clamp(140px, 20vw, 240px);        
}

/* ===== เอฟเฟกต์เข้าแบบ zoom-in-bounce ===== */
.option.circle.in-anim {
  animation: zoomInBounce 650ms cubic-bezier(.25,.8,.25,1) forwards;
  transform: scale(0.3);      /* เริ่มเล็กและจาง */
  opacity: 0;
}

@keyframes zoomInBounce {
  0%   { transform: scale(0.3); opacity: 0; }
  60%  { transform: scale(1.1); opacity: 1; }  
  100% { transform: scale(1);   opacity: 1; }
}

/* ตัวหนังสือในปุ่ม (ปรับได้ตรงนี้) */
.option.circle .label {
  font-size: clamp(22px, 3vw, 40px);          /* ขนาดตัวอักษร */
  font-weight: 900;                             /* ความหนา */
  letter-spacing: .5px;                         /* ระยะห่างตัวอักษร */
  color: #fff;                                  /* สีข้อความ */
}

.option.circle.glow{
  filter: drop-shadow(0 0 10px rgba(250,204,21,.70)) drop-shadow(0 0 18px rgba(250,204,21,.55));
}

/* ===== ข้อความหลังตอบถูก บริเวณตัวเลือกที่กด ===== */
/* หน้าตาเหมือนคำถาม แต่เล็กกว่านิดหน่อย */
.correct-pick-text{
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 21000;
  pointer-events: none;

  background: none;
  border: none;
  box-shadow: none;
  padding: 0;

  color: #fff;

  /* ขนาดเล็กกว่า #questionBox เล็กน้อย */
  font-size: clamp(
    calc(var(--qFontMin) * .72),
    calc(var(--qFontVW) * .72),
    calc(var(--qFontMax) * .72)
  );

  font-weight: 1000;
  line-height: 1.05;
  text-align: center;
  white-space: nowrap;

text-shadow:
  0 4px 12px rgba(0,0,0,.8),
  0 2px 4px rgba(0,0,0,.75),
  0 0 8px rgba(0,0,0,.55);

  opacity: 0;
  animation: correctPickTextShow 2000ms ease forwards;
}

@keyframes correctPickTextShow{
  0%{
    opacity: 0;
    transform: translate(-50%, -50%) translateY(10px) scale(.92);
  }
  16%{
    opacity: 1;
    transform: translate(-50%, -50%) translateY(0) scale(1);
  }
  78%{
    opacity: 1;
    transform: translate(-50%, -50%) translateY(0) scale(1);
  }
  100%{
    opacity: 0;
    transform: translate(-50%, -50%) translateY(-10px) scale(.96);
  }
}

/* ===== แถบเวลา ===== */
#timebarWrap{ position:fixed; left:0; right:0; bottom:0; height:12px; background:rgba(255,255,255,.12); z-index:16000; border-top:1px solid rgba(255,255,255,.2) }
#timebar{ height:100%; width:0%; background:#10b981; transition:width .1s linear }

/* ===== เอฟเฟกต์/Toast/ภาพผลลัพธ์ ===== */
#flash{ position:fixed; inset:0; background:transparent; pointer-events:none; z-index:17000 }
.flash-clear{ animation: flashC 2000ms ease-out }
@keyframes flashC{ 0%{background:rgba(255,255,255,.55)} 100%{background:transparent} }

.flash-in{ animation: flashIn .35s ease-out }
@keyframes flashIn{
  0%{ opacity:0; transform:translate(-50%,-50%) scale(1.04); box-shadow:0 0 0 0 rgba(255,255,255,0), 0 0 0 0 rgba(255,255,255,0) }
  30%{ opacity:1; box-shadow:0 0 24px 6px rgba(255,255,255,.75), 0 0 64px 12px rgba(255,255,255,.55) }
  100%{ opacity:1; transform:translate(-50%,-50%) scale(1); box-shadow:none }
}
.flash-in-cover{ animation: flashInCover .35s ease-out }
@keyframes flashInCover{
  0%{ opacity:0; box-shadow:0 0 0 0 rgba(255,255,255,0), 0 0 0 0 rgba(255,255,255,0) }
  30%{ opacity:1; box-shadow:0 0 24px 6px rgba(255,255,255,.75), 0 0 64px 12px rgba(255,255,255,.55) }
  100%{ opacity:1; box-shadow:none }
}

#roundToast{
  position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
  background:rgba(0,0,0,.78); border:1px solid rgba(255,255,255,.22);
  padding:18px 26px; border-radius:16px; font-size:clamp(22px,3vw,34px); font-weight:900;
  z-index:17500; display:none; text-align:center; white-space:nowrap; line-height:1.25;
}
#roundToast .q{ display:block }
#roundToast .a{ display:block; margin-top:.15em; opacity:.95 }
#roundToast .r{ display:block; margin-top:.35em; font-weight:1000 }
#roundToast .r.ok{ color:var(--ok) }
#roundToast .r.bad{ color:var(--bad) }

#ansImg{
  position:fixed; inset:0; width:100vw; height:100vh; object-fit:cover; object-position:center;
  opacity:.95; filter: drop-shadow(0 20px 60px rgba(0,0,0,.50));
  z-index:17499; display:none; pointer-events:none;
}

/* ===== กล้อง/แคนวาส AR ===== */
#cameraMirror{ position:fixed; inset:0; width:100vw; height:100vh; object-fit:cover; transform: scaleX(-1); z-index:1; display:none; background:#000 }
#camCanvas{ position:fixed; inset:0; width:100vw; height:100vh; z-index:2; pointer-events:none; display:none }
#game{ z-index:3; position:relative }

/* ปุ่ม Mute / Fullscreen (ดันมาอยู่หน้าสุด) */
#muteBtn, #fsBtn{
  position: fixed;
  right: 12px;
  width: 44px;
  height: 44px;
  border-radius: 999px;
  background: rgba(0,0,0,.45);
  border: 1px solid rgba(255,255,255,.3);
  color: #fff;
  font-size: 18px;
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
  z-index: 50000; /* สูงกว่า HUD และทุก overlay ในเกม */
}
#muteBtn{ bottom:12px }
#fsBtn{ bottom:62px }


/* มุมภาพประดับ (มีไฟล์ก็บังไว้ได้) */
body::after{ content:""; position:fixed; top:0; left:0; width:var(--corner-img-w, 220px); height:var(--corner-img-h, 220px); background:url("image/button1.png") no-repeat left top / contain; pointer-events:none; z-index:10000 }
body::before{ content:""; position:fixed; top:0; right:0; width:var(--corner2-img-w, 200px); height:var(--corner2-img-h, 200px); background:url("image/button2.png") no-repeat right top / contain; pointer-events:none; z-index:10000 }

/* ===== อีโมจิขนมลอยไปมุม ===== */
.fly-emoji{
  position:fixed;
  left:50vw;             /* เริ่มกลางจอ */
  top:50vh;
  font-size:clamp(48px, 8vw, 96px); /* 👈 ใหญ่ขึ้น */
  line-height:1;
  pointer-events:none;
  z-index:20000;
  opacity:0;
  transform:translate(0,0) scale(.9);
  filter: drop-shadow(0 6px 18px rgba(0,0,0,.35));
}

/* ระยะเวลา/ทิศปรับได้ด้วยตัวแปร --emoji-ms, --dx, --dy */
.fly-emoji.go{
  animation: emojiFly var(--emoji-ms, 1200ms) cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes emojiFly{
  0%   { opacity:0; transform:translate(0,0) scale(.9); }
  10%  { opacity:1; }
  100% { opacity:0; transform:translate(var(--dx, 0), var(--dy, -300px)) scale(1.1); }
}
/* ===== จบอีโมจิขนม ===== */


/* ===== เอฟเฟกต์หมุน + จางหายของวงกลม ===== */
.option.circle.flip-out {
  animation: flipOut 600ms ease forwards;
}

@keyframes flipOut {
  0%   { transform: rotateY(0deg) scale(1); opacity:1; }
  50%  { transform: rotateY(180deg) scale(1.1); opacity:0.9; }
  100% { transform: rotateY(360deg) scale(0.8); opacity:0; }
}


#timebarWrap{ display:none !important }

/* จางหายเรียบ ๆ (ใช้ตัวแปร --fade-ms) */
.option.circle.fade-out {
  animation: fadeOut var(--fade-ms, 600ms) ease forwards;
}

@keyframes fadeOut {
  0%   { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(0.9); }
}

/* ===== ตัวเลือกรูปภาพซ้าย-ขวา (Vocab Happy Land) ===== */
.option.img{
  position:absolute;
  display:grid; place-items:center;
/* ▼▼▼ แก้ตรงนี้: ไม่เอากรอบ/พื้นหลัง/ขอบ/ระยะห่าง และไม่ต้อง transition left/top */
  padding:0;
  border-radius:0;
  background: transparent;
  border: 0;
  box-shadow: none;
  width:  var(--imgW, clamp(240px, 30vw, 420px));
  height: var(--imgH, clamp(240px, 30vw, 420px));
  cursor:pointer; user-select:none; z-index:12;
/* เดิม:
  transition: top 800ms cubic-bezier(.2,.9,.2,1),
             left 800ms cubic-bezier(.2,.9,.2,1);
*/
  transition: none;
}
.option.img.in-anim{
  animation: zoomInBounce 650ms cubic-bezier(.25,.8,.25,1) forwards;
  transform: scale(0.3);
  opacity: 0;
}
/* ใช้ตัวแปร --fade-ms เช่นกัน */
.option.img.fade-out { animation: fadeOut var(--fade-ms, 600ms) ease forwards; }

.option.img.flip-out { animation: flipOut 600ms ease forwards; }

.option.img > img{
  max-width:100%;
  max-height:100%;
  width:auto; height:auto;
  object-fit:contain;
  display:block;

  /* เงาเดิม + เรืองแสงสีเหลืองตามขอบรูป */
  filter:
    drop-shadow(0 6px 18px rgba(0,0,0,.30))
    drop-shadow(0 0 10px rgba(250,204,21,.85))
    drop-shadow(0 0 22px rgba(250,204,21,.65));

  border-radius:0;
}

/* === Tap target สำหรับกดยืนยันรอบ (emoji ขนม) === */
.tap-target{
  position:absolute;
  font-size: var(--bonus-size, 162px);   /* ← ปรับขนาดได้ */
  line-height: 1;
  user-select:none;
  cursor:pointer;
  z-index: 20050;
  filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
  transition: transform 120ms ease;
}
.tap-target:active{ transform: scale(.92); }

/* ===== เอฟเฟกต์เกิดและหายของอีโมจิ (ปรับให้เห็นเฟดเข้าเด่นขึ้น) ===== */
.tap-target {
  position:absolute;
  font-size: var(--bonus-size, 162px);   /* ← ปรับขนาดได้ */
  line-height: 1;
  user-select:none;
  cursor:pointer;
  z-index: 20050;
  filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
  transition: transform 120ms ease;

  /* ฟาดเข้า 520ms + หน่วงเอฟเฟกต์อื่น 120ms */
  animation:
    emojiFadeIn 520ms ease-out both,
    glowPulse 1.8s ease-in-out infinite 120ms,
    wiggle 1.4s ease-in-out infinite 120ms;
  will-change: opacity;
}

.tap-target:active {
  transform: scale(.92);
}

.tap-target.disappear {
  animation: emojiFadeOut 400ms ease-in-out forwards !important;
}

/* เข้าแบบ fade-in (หน่วงครึ่งแรกไว้ที่ 0) */
@keyframes emojiFadeIn {
  0%   { opacity: 0; }
  45%  { opacity: 0; }
  100% { opacity: 1; }
}

/* ออกแบบ fade-out */
@keyframes emojiFadeOut {
  0%   { opacity: 1; }
  100% { opacity: 0; }
}

/* --- Glow for emoji (style only; ไม่ยุ่ง animation เพื่อไม่ทับ fade) --- */
.tap-target{
  text-shadow:
    0 0 10px rgba(255,255,255,.70),
    0 0 22px rgba(255,210,120,.55),
    0 0 36px rgba(255,140,0,.40);
}


/* ไม่ใส่ animation ที่ .glow เพื่อไม่ทับของตัวหลัก */
.tap-target.glow{ /* optional: จะลบคลาสนี้ทิ้งเลยก็ได้ */
  /* no animation here */
}


@keyframes wiggle {
  0%, 100% {
    transform: rotate(0deg);
  }
  15% {
    transform: rotate(-6deg);
  }
  30% {
    transform: rotate(6deg);
  }
  45% {
    transform: rotate(-4deg);
  }
  60% {
    transform: rotate(4deg);
  }
  75% {
    transform: rotate(-2deg);
  }
  90% {
    transform: rotate(2deg);
  }
}


/* ตำแหน่งอิสระของข้อความ/รูป (ปรับค่าเลขได้ตามใจ) */

/* เข้า: slide-in จากบน */

/* ===== Result Panel (สรุปคะแนนสวย ๆ) ===== */

/* ===== Action Challenge: รอข้อถัดไปแบบทำท่า/คลิกตำแหน่ง ===== */
.action-post{
  position:fixed;
  left:50%;
  top:50%;

.action-post.disappear{

}

@keyframes actionPostOut{

/* ===== Face Scanner Challenge ===== */
.face-scan-box{
  position:fixed;
  left:0;
  top:0;
  width:min(52vw, 440px);
  aspect-ratio:1/1;
  transform:translate(50vw, 50vh) translate(-50%, -50%) scale(.15);
  opacity:0;
  z-index:20060;
  border:12px solid rgba(255,255,255,1);
  border-radius:30px;
  box-shadow:
    0 0 30px rgba(0,0,0,.9),
    0 0 70px rgba(0,0,0,.6),
    inset 0 0 28px rgba(0,0,0,.45);

  pointer-events:none;
  transition:
    transform 520ms cubic-bezier(.2,.9,.2,1),
    opacity 260ms ease;

  will-change: transform, opacity;
}

.face-scan-box.show{
  opacity:1;
}

.face-scan-box.shrink-out{
  opacity:0;
  transition:
    transform 260ms ease,
    opacity 260ms ease;
}

.scan-capture-popup{
  position:fixed;

  /* 👇 เปลี่ยนจากมุม → กลางจอ */
  left:50%;
  top:50%;

  /* 👇 ขยายให้ใหญ่ขึ้น */
  width:min(60vw, 520px);

  aspect-ratio:1/1;
  object-fit:cover;

  border-radius:22px;
  border:8px solid #fff;

  box-shadow:
    0 14px 45px rgba(0,0,0,.5),
    0 0 35px rgba(255,255,255,.75);

  z-index:20080;
  pointer-events:none;

  opacity:0;

  /* 👇 สำคัญ: ต้องมี translate ไม่งั้นไม่อยู่กลาง */
  transform:translate(-50%,-50%) scale(.7) rotate(-3deg);

  /* ❗ ใช้ animation เดิม ไม่ต้องแก้ */
  animation: scanPopup 1400ms ease forwards;
}

@keyframes scanPopup{
  0%{ 
    opacity:0; 
    transform:translate(-50%,-50%) scale(.7) rotate(-3deg); 
  }
  18%{ 
    opacity:1; 
    transform:translate(-50%,-50%) scale(1.04) rotate(-3deg); 
  }
  72%{ 
    opacity:1; 
    transform:translate(-50%,-50%) scale(1) rotate(-3deg); 
  }
  100%{ 
    opacity:0; 
    transform:translate(-50%,-50%) scale(.85) rotate(-3deg); 
  }
}

.face-scan-box.flash{
  animation: scanFlash 440ms ease forwards;
}

@keyframes scanFlash{
  0%{ box-shadow:0 0 20px rgba(255,255,255,.75), inset 0 0 18px rgba(255,255,255,.25); }
  40%{
    box-shadow:
      0 0 0 9999px rgba(255,255,255,.65),
      0 0 50px rgba(255,255,255,1),
      inset 0 0 60px rgba(255,255,255,.9);
  }
  100%{ box-shadow:0 0 24px rgba(255,255,255,.75), inset 0 0 22px rgba(255,255,255,.22); }
}

.action-click-zone{
  position:fixed;
  z-index:20055;
  border:4px dashed rgba(255,255,255,.85);
  background:rgba(255,255,255,.12);
  border-radius:24px;
  box-shadow:0 0 24px rgba(255,255,255,.45);
  cursor:pointer;
  animation: zonePulse 1.1s ease-in-out infinite;
}

@keyframes zonePulse{
  0%,100%{ transform:scale(1); opacity:.8; }

}

<!-- ===== ควบคุม Mute (BGM เท่านั้น) ===== -->
<script>
(function(){
  const muteBtn = document.getElementById('muteBtn');
  const bgm     = document.getElementById('bgm');   // 🎵 เพลงพื้นหลัง
  if(!muteBtn || !bgm) return;

  let bgmMuted = false;      // สถานะ mute เฉพาะ BGM

  function applyBgmMute(m){
    bgmMuted = !!m;
    bgm.muted = bgmMuted;    // ✅ ปิด/เปิดแค่ bgm
    muteBtn.setAttribute('aria-pressed', String(bgmMuted));
    muteBtn.textContent = bgmMuted ? '🔇' : '🔊';
  }

  muteBtn.addEventListener('click', () => applyBgmMute(!bgmMuted));
})();
</script>


<!-- ===== ควบคุม Fullscreen ===== -->
<script>
(function(){
  const fsBtn = document.getElementById('fsBtn');
  if (!fsBtn) return;
  function fsEnabled(){ return document.fullscreenEnabled || document.webkitFullscreenEnabled || document.msFullscreenEnabled }
  function isFull(){ return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement }
  function requestFS(){ const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen)?.call(el) }
  function exitFS(){ (document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen)?.call(document) }
  function render(){ const on=!!isFull(); fsBtn.setAttribute('aria-pressed', String(on)); fsBtn.title = on ? 'ออกจากโหมดเต็มจอ' : 'เข้าสู่โหมดเต็มจอ'; fsBtn.textContent = on ? '🗗' : '⛶' }
  if (!fsEnabled()){ fsBtn.style.display='none'; return }
  fsBtn.addEventListener('click', () => { if(isFull()) exitFS(); else requestFS() });

/* ===== พูลรูปภาพต่อด่าน: data1, data2, data3 (word1..word50) ===== */
const IMG_EXT = '.webp';                            
function buildPool(dir, count=50, ext=IMG_EXT){

// === Level Asset Preloader: โหลดเฉพาะด่านที่เลือก + ไม่ล้าง cache ตอนเปลี่ยนด่าน ===
const __imgUrlCache  = new Set();
const __imgElemCache = new Map();

const __audioUrlCache  = new Set();
const __audioElemCache = new Map();

// จำว่าด่านไหน "โหลดครบแล้ว"
const __levelReadyMap = new Map();

// token กันกรณีกดด่านอื่นซ้อนระหว่างโหลด
let __preloadToken = 0;

// ตัวแปรนี้ไว้กัน startGame เผื่อถูกเรียกก่อนโหลดครบ
let LEVEL_READY = false;

/* ===== Manual cache clear =====
   เรียกเองได้จาก console:
   clearGamePreloadCache();        // ล้างทุกด่าน
   clearGamePreloadCache(1);       // ล้างเฉพาะด่าน 1
*/

    console.log(`[CACHE] cleared level ${lv}`);
    return;
  }

  __imgUrlCache.clear();
  __imgElemCache.clear();
  __audioUrlCache.clear();
  __audioElemCache.clear();

  LEVEL_READY = false;

  console.log('[CACHE] cleared all preload cache');
};

function isLevelReady(level){

}

async function warmDecode(url){
  if (!url) return null;

  const cached = __imgElemCache.get(url);
  if (cached && cached.complete && cached.naturalWidth > 0) return cached;

  const im = new Image();
  im.decoding = 'async';
  im.loading  = 'eager';

  await new Promise((resolve, reject)=>{
    im.onload = ()=> resolve();
    im.onerror = ()=> reject(new Error('โหลดรูปไม่ได้: ' + url));
    im.src = url;
  });

  try { await im.decode(); } catch(_) {}

  __imgUrlCache.add(url);
  __imgElemCache.set(url, im);
  return im;
}

async function warmAudio(url){
  if (!url) return null;

  const cached = __audioElemCache.get(url);
  if (cached && __audioUrlCache.has(url)) return cached;

  const au = new Audio();
  au.preload = 'auto';
  au.src = url;

  await new Promise((resolve, reject)=>{
    let settled = false;

    const done = ()=>{
      if (settled) return;
      settled = true;
      cleanup();
      resolve();
    };

    const fail = ()=>{
      if (settled) return;
      settled = true;
      cleanup();
      reject(new Error('โหลดเสียงไม่ได้: ' + url));
    };

    const cleanup = ()=>{
      au.removeEventListener('canplaythrough', done);
      au.removeEventListener('canplay', done);
      au.removeEventListener('loadeddata', done);
      au.removeEventListener('error', fail);
    };

    au.addEventListener('canplaythrough', done, { once:true });
    au.addEventListener('canplay', done, { once:true });
    au.addEventListener('loadeddata', done, { once:true });
    au.addEventListener('error', fail, { once:true });

    au.load();

    // กันบาง browser ไม่ยิง event แต่ไฟล์โหลดมาแล้ว
    setTimeout(done, 3500);
  });

  __audioUrlCache.add(url);
  __audioElemCache.set(url, au);
  return au;
}

function collectLevelImageUrls(level) {
  const pool = LEVEL_POOLS[level] || new Map();
  return [...pool.values()].filter(Boolean);
}

function getLevelBank(level){
  if (level === 1) return (typeof LEVEL1_BANK !== 'undefined' ? LEVEL1_BANK : []);
  if (level === 2) return (typeof NEEDS_BANK !== 'undefined' ? NEEDS_BANK : []);
  if (level === 3) return (typeof LEVEL3_BANK !== 'undefined' ? LEVEL3_BANK : []);
  return [];
}

function collectLevelVoiceUrls(level){
  const bank = getLevelBank(level);
  const urls = [];

  for (const q of bank){
    const src = pickVoiceSrc(level, q);
    if (src) urls.push(src);
  }

  return [...new Set(urls)];
}

function collectLevelPreloadAssets(level){
  const images = collectLevelImageUrls(level);
  const voices = collectLevelVoiceUrls(level);

  const commonAudio = [
    'image/select.mp3',
    'image/audio1.mp3',
    'image/wrong.mp3',
    'image/eat.mp3',
    'image/win2.mp3',
    'image/shutter.mp3'

  return {
    images: [...new Set(images)],

}

function updateLevelPreloadUI(done, total, label='กำลังโหลดไฟล์'){

      ? 'กำลังเตรียมรูปภาพและเสียงสำหรับด่านนี้'
      : 'ไฟล์ของด่านนี้พร้อมอยู่แล้ว';
  }
}

function hideLevelPreloadUI(){
  const screen = document.getElementById('levelPreloadScreen');
  if (screen) screen.style.display = 'none';
}

/** โหลดเฉพาะไฟล์ที่ยังไม่มีใน cache */
async function preloadLevelAssets(level, opts = {}){
  const lv = Number(level);
  const myToken = ++__preloadToken;

  // ถ้าด่านนี้เคยโหลดครบแล้ว และยังอยู่ใน cache ให้ข้าม
  if (isLevelReady(lv)) {
    LEVEL_READY = (window.currentLevel === lv);

    if (!opts.silent) {
      updateLevelPreloadUI(1, 1, 'โหลดเสร็จแล้ว');
      await new Promise(r => setTimeout(r, 180));
      hideLevelPreloadUI();
    }

    return true;
  }

  const assets = collectLevelPreloadAssets(lv);

  // โหลดเฉพาะที่ยังไม่เคยโหลด
  const imageJobs = assets.images
    .filter(url => !__imgUrlCache.has(url))
    .map(url => ({ type:'image', url }));

  const audioJobs = assets.audio
    .filter(url => !__audioUrlCache.has(url))
    .map(url => ({ type:'audio', url }));

  const jobs = [...imageJobs, ...audioJobs];

  let done = 0;
  const total = jobs.length;

  if (!opts.silent) {
    updateLevelPreloadUI(done, total, 'กำลังโหลดไฟล์');
  }

  // กรณีไม่มีอะไรต้องโหลดแล้ว แต่ levelReady ยังไม่ถูก mark
  if (!total){
    __levelReadyMap.set(lv, true);
    LEVEL_READY = (window.currentLevel === lv);

    if (!opts.silent) {
      updateLevelPreloadUI(1, 1, 'โหลดเสร็จแล้ว');
      await new Promise(r => setTimeout(r, 180));
      hideLevelPreloadUI();
    }

    return true;
  }

  for (const job of jobs){
    // ถ้ากดด่านใหม่ระหว่างโหลด ให้รอบเก่าหยุด
    if (myToken !== __preloadToken) return false;

    try{
      if (job.type === 'image') {
        await warmDecode(job.url);
      } else {
        await warmAudio(job.url);
      }
    }catch(err){
      // ไม่ให้เกมพัง แต่แจ้งไฟล์ที่โหลดไม่ได้ใน console
      console.warn('[PRELOAD FAIL]', job.url, err);
    }

    done++;

    if (!opts.silent) {
      updateLevelPreloadUI(
        done,
        total,
        job.type === 'image' ? 'กำลังโหลดรูปภาพ' : 'กำลังโหลดเสียง'
      );
    }
  }

  __levelReadyMap.set(lv, true);
  LEVEL_READY = (window.currentLevel === lv);

  if (!opts.silent) {
    updateLevelPreloadUI(total, total, 'โหลดเสร็จแล้ว');
    await new Promise(r => setTimeout(r, 250));
    hideLevelPreloadUI();
  }

  return true;
}

function ensurePreloadForLevel(level){
  return preloadLevelAssets(level, { silent:true });
}

/* ✅ เปิดให้ script อื่นเรียกใช้ได้ */
window.preloadLevelAssets = preloadLevelAssets;
window.ensurePreloadForLevel = ensurePreloadForLevel;
window.isLevelReady = isLevelReady;

function extractWordNumber(qObj){
  // 1) ถ้ามี imgKey/word/key
  const key = qObj?.imgKey || qObj?.key || qObj?.word || null;
  let m = key ? String(key).match(/word(\d+)/i) : null;
  if (m) return parseInt(m[1],10);

  // 2) ลองเดาจาก path รูป
  if (qObj?.img){
    m = String(qObj.img).match(/\/word(\d+)\.[a-z0-9]+$/i);
    if (m) return parseInt(m[1],10);
  }

  // 3) ไม่เจออะไร → เดาสุ่ม 1..50
  return (1 + ((Math.random()*50)|0));
}

// คำนวณพาธไฟล์และเล่นเสียง: level=1 ใช้ voice1..50 ใน sound1/
// level=2 → voice51..100 ใน sound2/, level=3 → voice101..150 ใน sound3/
function computeVoicePath(level, wordNum){
  // ปกติ wordNum จะ 1..50
  const n = Math.max(1, Math.min(50, Number(wordNum)||1));
  let base = 1;   // level 1 เริ่ม 1
  let folder = 'sound1';

  if (level === 2){ base = 51; folder = 'sound2'; }
  else if (level === 3){ base = 101; folder = 'sound3'; }

  // voice index จริง = base + (n-1)
  const vIndex = base + (n-1);
  // ไฟล์ตั้งชื่อตามที่ให้ไว้: voiceXX (ไม่มีนามสกุลระบุไว้ → แนะนำใช้ .mp3)
  return `${folder}/voice${vIndex}.mp3`;
}

// เลือกเสียงตามลำดับด่าน (voiceRel), เลขเต็ม (voiceAbs), หรือ fallback จาก wordN
function pickVoiceSrc(level, qObj){
  // 1) voiceAbs: ระบุเลขไฟล์เต็ม (1..150)
  if (Number.isFinite(qObj?.voiceAbs)) {
    const abs = Math.max(1, Math.min(150, qObj.voiceAbs|0));
    let folder = 'sound1';
    if (abs >= 101) folder = 'sound3';
    else if (abs >= 51) folder = 'sound2';
    return `${folder}/voice${abs}.mp3`;
  }

  // 2) voiceRel: ระบุเลข 1..50 ของ "ด่านนั้น"
  if (Number.isFinite(qObj?.voiceRel)) {
    const rel = Math.max(1, Math.min(50, qObj.voiceRel|0));
    let idx = rel;       // L1 base
    let folder = 'sound1';
    if (level === 2){ idx = 50 + rel; folder='sound2'; }   // 51..100
    else if (level === 3){ idx = 100 + rel; folder='sound3'; } // 101..150
    return `${folder}/voice${idx}.mp3`;
  }

  // 3) fallback: อิงจาก wordN ของภาพคำถาม
  const n = extractWordNumber(qObj);        // 1..50
  return computeVoicePath(level, n);        // map ไปโฟลเดอร์ตามด่าน
}

function playQuestionVoiceSmart(level, qObj){
  try{
    const src = pickVoiceSrc(level, qObj);
    const cachedAudio = __audioElemCache.get(src);

    const player = cachedAudio || voiceAudio;
    if (!player) return;

    player.pause();
    player.currentTime = 0;
    player.muted = false;
    player.volume = VOL_VOICE;

    if (!cachedAudio) player.src = src;

    player.play()?.catch(err=>{
      console.warn('[VOICE PLAY FAIL]', src, err);
    });
  }catch(err){
    console.warn('[VOICE ERROR]', err);
  }
}

function pickWrongKey(level, correctKey){
  const pool = LEVEL_POOLS[level] || new Map();

  let keys = [...pool.keys()].filter(k =>
    k !== correctKey &&
    !lastRoundKeys.includes(k)
  );

  if (!keys.length){
    keys = [...pool.keys()].filter(k => k !== correctKey);
  }

  if (!keys.length) return correctKey;
  return keys[(Math.random()*keys.length)|0];
}

/* ===== สร้างตัวเลือกรูปภาพซ้าย-ขวา (เอฟเฟกต์เข้า/ออกเหมือนเดิม) =====
   qObj = { imgKey: 'word17', ... }
*/
function spawnTwoImageOptions(qObj, level){
  const pool = LEVEL_POOLS[level] || new Map();
  const correctKey = qObj?.imgKey || qObj?.key || qObj?.word || null;

  let derivedKey = null;
  if (!correctKey && qObj?.img){
    const m = String(qObj.img).match(/\/(word\d+)\.[a-z0-9]+$/i);
    if (m) derivedKey = m[1];
  }
  const finalCorrectKey = correctKey || derivedKey || ('word'+(1+((Math.random()*50)|0)));
const correctSrc = pool.get(finalCorrectKey) || '';
const wrongKey   = pickWrongKey(level, finalCorrectKey);
const wrongSrc   = pool.get(wrongKey) || '';

lastRoundKeys = [finalCorrectKey, wrongKey];

// สุ่มว่ารูปถูกอยู่ซ้ายหรือขวา
  const order = Math.random()<0.5 ? ['left','right'] : ['right','left'];
  const defs = [
    { ok:true,  side:order[0], src:correctSrc },
    { ok:false, side:order[1], src:wrongSrc   },
  ];

  defs.forEach(def=>{
    const el = document.createElement('div');
    el.className = 'option img in-anim';
    el.dataset.correct = String(!!def.ok);
    el.dataset.side    = def.side;

const im = document.createElement('img');
im.alt = def.ok ? 'รูปที่ถูกต้อง' : 'รูปหลอก';

// << ใช้แคชถ้ามี + รับประกัน decode แล้ว >>
const url = def.src || '';
const cached = __imgElemCache.get(url);
if (cached && cached.complete && cached.naturalWidth > 0){
  im.src = cached.src;
} else {
  // เผื่อยังไม่อยู่ cache (กรณีเพิ่งเปลี่ยนด่าน) — เติมแคชแบบเบา ๆ
  warmDecode(url).then(img => { im.src = img.src; }).catch(()=>{ im.src = url; });
}

    el.appendChild(im);
    game.appendChild(el);

    // คำนวณโซนวาง: ซ้าย/ขวา โดยเว้นกึ่งกลางจอ
    const SAFE_PAD = 12;

// === วัดขนาดจริง แล้ววาง “จุดยึดคงที่” ออกด้านข้างมากขึ้น ===
const prevTransform = el.style.transform;
el.style.transform = 'none';
const cs = getComputedStyle(el);
const realW = parseFloat(cs.width)  || 240;
const realH = parseFloat(cs.height) || 240;
el.style.transform = prevTransform;

// ขยับออกด้านข้าง: ซ้าย ~14% ขวา ~86% และวางต่ำลงนิด (~60%)
// ปรับค่า 0.14 / 0.86 / 0.60 ได้ตามใจ
const SAFE = 12;
const anchor = (side)=>{
  const cx = side === 'left' ? innerWidth * 0.14 : innerWidth * 0.86;
  const cy = innerHeight * 0.60;

  // คำนวณซ้าย/บนจากกึ่งกลาง + clamp กันชิดขอบ
  let left = Math.round(cx - realW/2);
  let top  = Math.round(cy - realH/2);

  left = Math.max(SAFE, Math.min(innerWidth  - realW - SAFE, left));
  top  = Math.max(SAFE, Math.min(innerHeight - realH - SAFE, top));

  return { left, top };
};

const REWARD_EMOJIS = ['⭐', '🏆', '💎', '🍀'];

/* direction: 'top-right' | 'top-left' | 'bottom-right' | 'bottom-left'
   หรือจะส่งเป็นพิกัด {x, y} เองก็ได้ */
function getTargetDelta(direction='top-right'){
  const margin = 24;
  const cx = innerWidth / 2;
  const cy = innerHeight / 2;

  let tx = innerWidth - margin;
  let ty = margin;

  if (typeof direction === 'object' && direction && Number.isFinite(direction.x) && Number.isFinite(direction.y)){
    tx = direction.x; ty = direction.y;
  } else {
    switch (direction){
      case 'top-left':     tx = margin;            ty = margin;            break;
      case 'bottom-right': tx = innerWidth-margin; ty = innerHeight-margin;break;
      case 'bottom-left':  tx = margin;            ty = innerHeight-margin;break;
      case 'top-right':
      default:             tx = innerWidth-margin; ty = margin;            break;
    }
  }
  return { dx: tx - cx, dy: ty - cy };
}

function launchEmojiToCorner(direction='top-right', durationMs=900){
  const el = document.createElement('div');
  el.className = 'fly-emoji';
  el.textContent = pickEmoji();

  const {dx, dy} = getTargetDelta(direction);
  el.style.setProperty('--dx', dx + 'px');
  el.style.setProperty('--dy', dy + 'px');
  el.style.setProperty('--emoji-ms', durationMs + 'ms');

  document.body.appendChild(el);
  // trigger animation in next frame
  requestAnimationFrame(()=> el.classList.add('go'));
  el.addEventListener('animationend', ()=> el.remove(), {once:true});
}

function makeScanPositions(){
  const boxSize = Math.min(innerWidth * 0.52, 440);
  const borderPad = 28;
  const half = (boxSize / 2) + borderPad;

  const leftX   = half;
  const rightX  = innerWidth - half;
  const topY    = half;
  const bottomY = innerHeight - half;

  const midX = innerWidth / 2;
  const midY = innerHeight / 2;

  return shuffle([
    { x: leftX,  y: topY },
    { x: rightX, y: topY },
    { x: leftX,  y: bottomY },
    { x: rightX, y: bottomY },
    { x: midX,   y: Math.max(topY, innerHeight * 0.35) },
    { x: midX,   y: Math.min(bottomY, innerHeight * 0.65) },
    { x: Math.max(leftX, innerWidth * 0.28), y: midY },
    { x: Math.min(rightX, innerWidth * 0.72), y: midY },
  ]).slice(0, 3);
}

function getScanBoxSize(){
  return Math.min(innerWidth * 0.52, 440);
}

function moveScanBoxTo(x, y, scale=1){
  if (!__scanBox) return;

  const size = getScanBoxSize();

  __scanBoxState = {
    x,
    y,
    scale,
    width: size,
    height: size,
    left: x - size / 2,
    right: x + size / 2,
    top: y - size / 2,
    bottom: y + size / 2
  };

  __scanBox.style.transform =
    `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${scale})`;
}

function captureScanBoxSnapshot(){
  if (!__scanBox || !__scanBoxState) return null;

  const video = document.getElementById('cameraMirror');
  if (!video || !video.videoWidth || !video.videoHeight) return null;

  const r = __scanBoxState;
  const CAP = 220;

  const canvas = document.createElement('canvas');
  canvas.width = CAP;
  canvas.height = CAP;

  const ctx = canvas.getContext('2d', { alpha:false });
  if (!ctx) return null;

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const scale = Math.max(innerWidth / vw, innerHeight / vh);
  const drawW = vw * scale;
  const drawH = vh * scale;
  const offX = (innerWidth - drawW) / 2;
  const offY = (innerHeight - drawH) / 2;

  let sx = ((innerWidth - r.right) - offX) / scale;
  let sy = (r.top - offY) / scale;
  let sw = r.width / scale;
  let sh = r.height / scale;

  sx = Math.max(0, Math.min(vw - 1, sx));
  sy = Math.max(0, Math.min(vh - 1, sy));
  sw = Math.max(1, Math.min(vw - sx, sw));
  sh = Math.max(1, Math.min(vh - sy, sh));

  ctx.save();
  ctx.translate(CAP, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, CAP, CAP);
  ctx.restore();

  return canvas.toDataURL('image/jpeg', 0.7);
}

function isFaceInsideScanBox(lm){
  if (!lm || !__scanBox || !__scanBoxState) return false;

  const facePoints = [lm[0], lm[1], lm[2], lm[3], lm[4], lm[7], lm[8]].filter(Boolean);
  if (!facePoints.length) return false;

  const r = __scanBoxState;

  const padX = r.width * 0.45;
  const padY = r.height * 0.45;

  const left   = r.left   - padX;
  const right  = r.right  + padX;
  const top    = r.top    - padY;
  const bottom = r.bottom + padY;

  return facePoints.some(p=>{
    const x = (1 - p.x) * innerWidth;
    const y = p.y * innerHeight;

    return x >= left && x <= right && y >= top && y <= bottom;
  });
}

function spawnClickZone(zone){

  const W = Math.min(innerWidth * .34, 320);

  const cx = innerWidth / 2;

  let left = cx - W/2;

  if (zone === 'top')    top  = cy - H - 80;
  if (zone === 'bottom') top  = cy + 80;
  if (zone === 'left')   left = cx - W - 110;
  if (zone === 'right')  left = cx + 110;

  left = Math.max(12, Math.min(innerWidth  - W - 12, left));
  top  = Math.max(12, Math.min(innerHeight - H - 12, top));

  z.style.left = left + 'px';
  z.style.top = top + 'px';

function isPostPoseOK(id, lm){
  if (!lm) return false;

  // MediaPipe Pose landmarks:
  // 11 left shoulder, 12 right shoulder
  // 13 left elbow,    14 right elbow
  // 15 left wrist,    16 right wrist
  // 23 left hip,      24 right hip
  // 27 left ankle,    28 right ankle

  const LS=lm[11], RS=lm[12], LE=lm[13], RE=lm[14], LW=lm[15], RW=lm[16];
  const LH=lm[23], RH=lm[24], LA=lm[27], RA=lm[28];
  if (!LS || !RS || !LW || !RW || !LA || !RA) return false;

  const headTopY = Math.min(LS.y, RS.y) - 0.10;
  const ankleY = Math.min(LA.y, RA.y);

  if (id === 'post1'){
    // มือข้างใดข้างหนึ่งสูงกว่าไหล่/เหนือหัว
    return LW.y < headTopY || RW.y < headTopY;
  }

if (id === 'post2'){
  // ยกแขนซ้ายระดับไหล่
  return (
    LW.y < LS.y + 0.05 &&           // มือสูงระดับไหล่ (ไม่ต่ำเกิน)
    Math.abs(LW.y - LS.y) < 0.20 && // ใกล้ระดับไหล่
    Math.abs(LW.x - LS.x) > 0.15    // กางออกด้านข้าง
  );
}

if (id === 'post3'){
  // ยกแขนขวาระดับไหล่
  return (
    RW.y < RS.y + 0.05 &&
    Math.abs(RW.y - RS.y) < 0.20 &&
    Math.abs(RW.x - RS.x) > 0.15
  );
}

  if (id === 'post4'){
    // มือข้างใดข้างหนึ่งอยู่ระดับเดียวกับเท้า/ข้อเท้า
    return Math.abs(LW.y - ankleY) < 0.14 || Math.abs(RW.y - ankleY) < 0.14;
  }

  return false;
}

  document.querySelectorAll('.option, .tap-target, .fly-emoji').forEach(n=> n.remove());

  if (qImg){

    qImg.onerror = null;
    qImg.removeAttribute('src');
    qImg.style.display = 'none';
    qImg.classList.remove('in-pre','in-go','out-left','out-right','fx');
  }

  stopTimebar();
  stopClockUI();
  resetClockUI();

  // 5) หยุดเสียงทุกตัวทันที (รวม voice ที่กำลังเล่น)
  const audios = [voiceAudio, hitSound, winSound, selectSound, eatSound, wrongSound, bgm];
  audios.forEach(a=>{
    try{
      if(!a) return;
      a.pause();
      a.currentTime = 0;

  });

  // ถ้าบอสไม่อยากให้ BGM ดับตอนกลับเมนู ให้ stopBgm=false ได้
  if (!stopBgm && bgm){

  document.body.classList.remove('in-game');

  // 7) ทำให้สนามมองเห็น/ไม่ค้าง hidden (กันเคสจบด่านซ่อน game ไว้)
  game.style.visibility = 'visible';

  (parseFloat(cs.borderLeftWidth)  || 0) +
  (parseFloat(cs.borderRightWidth) || 0);

/* Helper: รอจนกว่าทุก element จะยิง 'transitionend' อย่างน้อย 1 ครั้ง หรือครบ timeout (ms) */
function waitForBothTransitions(els, timeoutMs=600){
  const once = (node, type) => new Promise(res=>{
    let done=false;
    const h = ()=>{ if(!done){ done=true; node.removeEventListener(type,h); res(); } };
    node.addEventListener(type, h, {once:true});
    // กันกรณีไม่มี transition หรือคลาสซ้ำเดิม
    setTimeout(h, timeoutMs);
  });
  return Promise.all( (els||[]).map(n=> once(n,'transitionend')) );
}

function getCorrectPickMessage(){
  const q = currentRoundQuestion || {};
  const level = Number(window.currentLevel) || 1;
  const key = String(q.imgKey || q.key || q.word || '').trim();

  const msg =
    q.feedback ||
    CORRECT_PICK_TEXT_BY_LEVEL?.[level]?.[key] ||
    '';

  // ✅ ถ้าไม่มีในตารางแปล จะยังขึ้นข้อความ ไม่หาย
  if (msg) return msg;

  if (q.question) return `ถูกต้อง: ${q.question}`;
  return 'ถูกต้อง!';
}

function showCorrectPickTextNear(target){
  return new Promise(resolve=>{
    // ลบของเก่ากันค้าง/ซ้อน
    document.querySelectorAll('.correct-pick-text').forEach(n=>n.remove());

    let rect = null;
    let msg = getCorrectPickMessage();

    // ✅ รับได้ทั้ง element หรือ object ที่เก็บ rect/message ไว้ล่วงหน้า
    if (target?.rect) {
      rect = target.rect;
      if (target.message) msg = target.message;
    } else if (target?.getBoundingClientRect) {
      rect = target.getBoundingClientRect();
    }

    if (!rect) {
      setTimeout(resolve, 2000);
      return;
    }

    const box = document.createElement('div');
    box.className = 'correct-pick-text';
    box.textContent = msg || 'ถูกต้อง!';

    document.body.appendChild(box);

    const pad = 12;
    const x = Math.max(pad, Math.min(innerWidth - pad, rect.left + rect.width / 2));
    const y = Math.max(pad, Math.min(innerHeight - pad, rect.top + rect.height / 2));

    box.style.left = x + 'px';
    box.style.top  = y + 'px';

    setTimeout(()=>{
      box.remove();
      resolve();
    }, 2000);
  });
}

        spawnTwoCircles(q.correctTag);

        spawnTwoAnswerCircles(q.choices, q.correctIndex);

    const guide=document.getElementById('guideScreen');

    return overlayOpen || (!landing.classList.contains('hide')) || startOpen || guideOpen;
  }
  function handleHidden(){ wasRunning = running && !ended && !uiBlockingOpen(); if(wasRunning) pauseGame() }
  function handleVisible(){ if(wasRunning && paused && !ended && !uiBlockingOpen()) resumeGame(); wasRunning=false }
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) handleHidden(); else handleVisible() });

<script>
(function(){
  const micBtn   = document.getElementById('micBtn'); // ไม่มีปุ่ม = ไม่ทำงาน
  if(!micBtn) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ micBtn.textContent='🎤 ไม่รองรับ'; micBtn.disabled=true; return }
  const rec = new SR(); rec.lang='th-TH'; rec.continuous=true; rec.interimResults=true;
  function tokensFrom(s){ s=(s||'').toLowerCase().trim(); s=s.replace(/\s*(ค่ะ|ครับ|คะ|ฮะ)$/,''); return s.split(/[\s,，。\.!?:;、]+/).filter(Boolean) }
  function currentOptionsMap(){ const map=new Map(); 

document.querySelectorAll('.option').forEach(n=>{ 
     const t=(n.textContent||'').trim().toLowerCase(); if(!map.has(t)) map.set(t,[]); map.get(t).push(n) }); return map }
  function pickNearest(arr){ return arr[0] }
  function tryFire(phrase){ const toks=tokensFrom(phrase); if(!toks.length) return false; const cmap=currentOptionsMap(); for(const t of toks){ if(cmap.has(t)){ const node = pickNearest(cmap.get(t)); node?.click(); return true } } return false }
  rec.onresult=(e)=>{ for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; const txt=(r[0]?.transcript||'').trim(); if(!txt) continue; tryFire(txt) } };
})();
</script>

<!-- ===== Pose (มือเป็นวงกลมแตะเลือกช้อยส์) ===== -->
<script type="module">
import {PoseLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";
const camBtn = document.getElementById('camBtn');
const video  = document.getElementById('cameraMirror');
const cvs    = document.getElementById('camCanvas');
const ctx    = cvs.getContext('2d', { alpha: true });
const DETECT_W = 320;
let detectCanvas = document.createElement('canvas');
let detectCtx = detectCanvas.getContext('2d', { alpha:false, desynchronized:true });
let CAM_ON=false, landmarker=null, raf=0, stream=null;

function fitCanvas(){ const dpr = CAM_ON? 1 : Math.max(1, window.devicePixelRatio||1); cvs.width=Math.round(innerWidth*dpr); cvs.height=Math.round(innerHeight*dpr); cvs.style.width=innerWidth+'px'; cvs.style.height=innerHeight+'px'; ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr) }
fitCanvas(); addEventListener('resize', fitCanvas);
function coverCropRect(){ const vw=video.videoWidth||640, vh=video.videoHeight||480; const sw=innerWidth, sh=innerHeight; const scale=Math.max(sw/vw, sh/vh); const sW=Math.round(sw/scale), sH=Math.round(sh/scale); const sX=Math.round((vw-sW)/2), sY=Math.round((vh-sH)/2); return {sX,sY,sW,sH,vw,vh,sw,sh} }
function mapToScreen(nx,ny){ const {sX,sY,sW,sH,vw,vh,sw,sh} = coverCropRect(); const px=nx*vw, py=ny*vh; const u=(px-sX)/sW, v=(py-sY)/sH; let x=u*sw, y=v*sh; x=sw-x; return {x,y} }

 	const SHOW_HAND_BALL=false; 
 	const lastHitAt=new WeakMap(); 
 	const HIT_LOCK_MS=160;
function circleIntersectsRect(cx,cy,r, rc){ 
 	const nx=Math.max(rc.left, 
 	Math.min(cx, rc.right)); 
 	const ny=Math.max(rc.top, 
 	Math.min(cy, rc.bottom)); 
 	const dx=cx-nx, dy=cy-ny;    	
 	return (dx*dx+dy*dy)<=r*r 
}

function hitByCircle(center, r){
  if (window.ended) return;   
  const opts = [...document.querySelectorAll('.option, .tap-target')];


  for (const n of opts){
    const rc = n.getBoundingClientRect();
    if (circleIntersectsRect(center.x, center.y, r, rc)){
      const t = performance.now();
      const last = lastHitAt.get(n) || 0;
      if (t - last < HIT_LOCK_MS) continue;
      lastHitAt.set(n, t);
      n.click();
    }
  }
}


async function ensureLandmarker(){ if(landmarker) return landmarker; const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"); landmarker = await PoseLandmarker.createFromOptions(fileset, { baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" }, runningMode:'VIDEO', numPoses:1, minPoseDetectionConfidence:.35, minPosePresenceConfidence:.35, minTrackingConfidence:.35 }); return landmarker }
function drawHandBall(elbowIdx, wristIdx, lm){ if(!lm[elbowIdx]||!lm[wristIdx]) return null; const elbow = mapToScreen(lm[elbowIdx].x, lm[elbowIdx].y); const wrist = mapToScreen(lm[wristIdx].x, lm[wristIdx].y); const r=24; const L=Math.max(1, Math.hypot(wrist.x-elbow.x, wrist.y-elbow.y)); const ux=(wrist.x-elbow.x)/L, uy=(wrist.y-elbow.y)/L; const HAND_PUSH=1.5, PUSH_PX=6; const center={ x: wrist.x + ux*(r*HAND_PUSH+PUSH_PX), y: wrist.y + uy*(r*HAND_PUSH+PUSH_PX) }; if(SHOW_HAND_BALL){ ctx.beginPath(); ctx.arc(center.x,center.y,r,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.stroke(); } hitByCircle(center, r*.95); return center }

function drawPoseAndColliders(res){
  const sw = innerWidth, sh = innerHeight;
  ctx.clearRect(0,0,sw,sh);

  if(!res?.landmarks?.length) return;
  const lm = res.landmarks[0];

  // ระบบมือแตะปุ่มเดิม
  drawHandBall(13,15,lm);
  drawHandBall(14,16,lm);

if (typeof window.__checkActionPose === 'function') {
  window.__checkActionPose(lm);
}
}

function runLoop(){ const step=()=>{ if(!video.videoWidth){ raf=requestAnimationFrame(step); return } const now=performance.now(); try{ const {sX,sY,sW,sH}=coverCropRect(); detectCtx.drawImage(video, sX,sY,sW,sH, 0,0, detectCanvas.width, detectCanvas.height); const res=landmarker.detectForVideo(detectCanvas, now); drawPoseAndColliders(res) }catch(e){} raf=requestAnimationFrame(step) }; raf=requestAnimationFrame(step) }
async function startCamera(){ await ensureLandmarker(); 
    stream = await navigator.mediaDevices.getUserMedia({
  video: { width: 960, height: 540, frameRate: 30, facingMode: 'user' },
  audio: false
});                       
                          
    video.srcObject=stream; await video.play().catch(()=>{}); const vw=video.videoWidth||640, vh=video.videoHeight||480; const ratio=vw/vh; detectCanvas.width=DETECT_W; detectCanvas.height=Math.round(DETECT_W/ratio); video.style.display='block'; cvs.style.display='block'; camBtn.textContent='📷 กล้อง: เปิด'; CAM_ON=true; fitCanvas(); runLoop() }
function stopCamera(){ cancelAnimationFrame(raf); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null } try{ video.pause() }catch(e){} video.removeAttribute('srcObject'); video.style.display='none'; cvs.style.display='none'; ctx.clearRect(0,0,innerWidth,innerHeight); camBtn.textContent='📷 กล้อง: ปิด'; CAM_ON=false; fitCanvas() }
camBtn.addEventListener('click', async ()=>{ if(!stream){ try{ await startCamera() }catch(err){ camBtn.textContent='📷 กล้อง: ไม่ได้รับอนุญาต'; camBtn.disabled=true } } else { stopCamera() } });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && stream) stopCamera() });
</script>

<script>
function updateLandingScale(){
  const landing = document.querySelector('#landing .landing-inner');
  if(!landing) return;

  // reset ก่อนวัด
  landing.style.setProperty('--landing-scale', 1);

  const rect = landing.getBoundingClientRect();
  const maxH = window.innerHeight * 0.95; // กันชนขอบล่างนิด

  if(rect.height > maxH){
    const scale = maxH / rect.height;
    landing.style.setProperty('--landing-scale', scale);
  }
}

// เรียกตอนโหลด + resize
window.addEventListener('load', updateLandingScale);
window.addEventListener('resize', updateLandingScale);
window.addEventListener('orientationchange', updateLandingScale);
